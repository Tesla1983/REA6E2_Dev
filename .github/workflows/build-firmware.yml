name: Build RA6E2 Firmware

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

# 发布 Release 需要写权限（仅 tag 推送时真正用到）; 普通分支/PR 构建用默认读权限即可。
permissions:
  contents: write

concurrency:
  group: ci-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定版本的工具链(自带 newlib + binutils)，避免 apt 版本漂移 / 分裂包缺失，
      # 也与本地 14.3 同代，不会触发 GCC 15 把兼容指针类型等默认升为错误。
      - name: Install ARM GCC toolchain (pinned 14.2.rel1)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.rel1'

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Toolchain diagnostics
        run: |
          arm-none-eabi-gcc --version | head -1
          which arm-none-eabi-objcopy arm-none-eabi-objdump

      - name: Configure (CMake + Ninja)
        run: |
          cmake -G Ninja -B build \
                -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-ra6e2.cmake \
                -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build

      - name: List build artifacts
        run: ls -la build/ra6e2_fw.* 2>/dev/null || echo "NO ARTIFACTS"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.config }}
          path: |
            build/ra6e2_fw.elf
            build/ra6e2_fw.hex
            build/ra6e2_fw.bin
            build/ra6e2_fw.srec
            build/ra6e2_fw.map
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish firmware release
    # 仅当推送版本标签(v*)时发布; 取 Release 矩阵产物作为公开下载固件
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download Release firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-Release
          path: release-artifacts

      - name: Draft release notes (构建信息)
        run: |
          {
            echo "## RA6E2 固件构建信息"
            echo ""
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 标签: \`${{ github.ref_name }}\`"
            echo "- 工具链: \`$(arm-none-eabi-gcc --version | head -1)\`"
            echo "- 目标: Renesas RA6E2 (R7FA6E2BB, Cortex-M33)"
            echo ""
            echo "### 下载"
            echo "- \`ra6e2_fw.bin\` —— 裸镜像, 烧录工具/上位机直接用"
            echo "- \`ra6e2_fw.hex\` —— Intel HEX, 通用编程器"
            echo "- \`ra6e2_fw.elf\` —— 含调试符号"
            echo "- \`ra6e2_fw.map\` / \`ra6e2_fw.srec\` —— 链接映射 / Motorola S-record"
            echo ""
            echo "### 校验和"
            echo '```'
            sha256sum release-artifacts/ra6e2_fw.bin
            echo '```'
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ra6e2_fw.elf
            release-artifacts/ra6e2_fw.hex
            release-artifacts/ra6e2_fw.bin
            release-artifacts/ra6e2_fw.srec
            release-artifacts/ra6e2_fw.map
          body_path: release_notes.md
          generate_release_notes: true
          make_latest: true
