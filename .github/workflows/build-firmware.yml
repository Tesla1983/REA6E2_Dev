name: Build RA6E2 Firmware & GUI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

# 发布 Release 需要写权限（仅 tag 推送时真正用到）; 普通分支/PR 构建用默认读权限即可。
permissions:
  contents: write

concurrency:
  group: ci-ra6e2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定版本的工具链(自带 newlib + binutils)，且与本地 14.3 rel1 完全一致，
      # 避免 apt 版本漂移 / 分裂包缺失，也规避 GCC 15 把兼容指针类型等默认升为错误。
      # 注意：carlosperate 动作版本字符串用大写 R（如 14.3.Rel1）。
      - name: Install ARM GCC toolchain (pinned 14.3.Rel1)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.3.Rel1'

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Toolchain diagnostics
        run: |
          arm-none-eabi-gcc --version | head -1
          which arm-none-eabi-objcopy arm-none-eabi-objdump

      - name: Configure (CMake + Ninja)
        run: |
          cmake -G Ninja -B build \
                -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-ra6e2.cmake \
                -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build

      - name: List build artifacts
        run: ls -la build/ra6e2_fw.* 2>/dev/null || echo "NO ARTIFACTS"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.config }}
          path: |
            build/ra6e2_fw.elf
            build/ra6e2_fw.hex
            build/ra6e2_fw.bin
            build/ra6e2_fw.srec
            build/ra6e2_fw.map
          if-no-files-found: error
          retention-days: 90

  # 上位机 GUI：必须在 Windows (MSVC) 上编译——依赖 windows crate 且 build.rs 用
  # /MANIFESTUAC 嵌入管理员提权清单，只能在 x86_64-pc-windows-msvc 下链接生效。
  build-gui:
    name: Build GUI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui"

      - name: Build GUI release (force MSVC target)
        # 必须显式指定 MSVC target：某些 windows runner 默认 toolchain 是 GNU，
        # 此时 build.rs 的 target_env=="msvc" 不成立会跳过 UAC 清单嵌入。
        # 指定 target 后产物路径变为 target/<triple>/release/，下面路径要同步。
        run: cargo build --release --target x86_64-pc-windows-msvc
        working-directory: gui

      - name: Verify UAC manifest embedded
        run: |
          $path = "gui/target/x86_64-pc-windows-msvc/release/ra6e2-monitor.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          # 清单可能以 UTF-8(ASCII) 或 UTF-16LE 存储，两种形态都搜一遍，避免编码假设误判
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $utf16 = [System.Text.Encoding]::Unicode.GetString($bytes)
          if ($ascii.Contains("requireAdministrator") -or $utf16.Contains("requireAdministrator")) {
            Write-Host "OK: requireAdministrator manifest present"
          } else {
            Write-Error "FAIL: requireAdministrator manifest missing"
            exit 1
          }

      - name: Upload GUI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-release
          path: gui/target/x86_64-pc-windows-msvc/release/ra6e2-monitor.exe
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    # 仅当推送版本标签(v*)时发布; 取 Release 矩阵产物 + 上位机 exe 作为公开下载内容
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-gui]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Release firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-Release
          path: release-artifacts

      - name: Download GUI artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-release
          path: gui-artifacts

      - name: Draft release notes (构建信息 + 版本要点)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## RA6E2 固件 + 上位机发布说明"
            echo ""
            echo "- 提交: \`${{ github.sha }}\`"
            echo "- 标签: \`${{ github.ref_name }}\`"
            echo "- 固件工具链: \`$(arm-none-eabi-gcc --version | head -1)\`"
            echo ""
            # 取本次 tag 的注释作为「版本要点」（注释由发布者手写，含固件/上位机变更摘要）。
            # release 任务无 git 仓库，故走 GitHub API：先取 tag ref 指向的对象，再取 tag 对象注释。
            REF_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}" --jq '.object.sha' 2>/dev/null || true)
            TAG_MSG=""
            if [ -n "$REF_SHA" ]; then
              TAG_MSG=$(gh api "repos/${{ github.repository }}/git/tags/${REF_SHA}" --jq '.message' 2>/dev/null || true)
            fi
            if [ -n "$TAG_MSG" ]; then
              echo "### 版本要点"
              echo ""
              echo "$TAG_MSG"
              echo ""
            fi
            echo "### 固件下载"
            echo "- \`ra6e2_fw.bin\` —— 裸镜像, 烧录工具/上位机直接用"
            echo "- \`ra6e2_fw.hex\` —— Intel HEX, 通用编程器"
            echo "- \`ra6e2_fw.elf\` —— 含调试符号"
            echo "- \`ra6e2_fw.map\` / \`ra6e2_fw.srec\` —— 链接映射 / Motorola S-record"
            echo ""
            echo "### 上位机 (Windows)"
            echo "- \`ra6e2-monitor.exe\` —— 上位机 GUI（需**管理员运行**以读取 CPU 温度/风扇，已内嵌 UAC 提权清单）"
            echo ""
            echo "### 校验和"
            echo '```'
            sha256sum release-artifacts/ra6e2_fw.bin
            sha256sum gui-artifacts/ra6e2-monitor.exe
            echo '```'
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/ra6e2_fw.elf
            release-artifacts/ra6e2_fw.hex
            release-artifacts/ra6e2_fw.bin
            release-artifacts/ra6e2_fw.srec
            release-artifacts/ra6e2_fw.map
            gui-artifacts/ra6e2-monitor.exe
          body_path: release_notes.md
          generate_release_notes: true
          make_latest: true
